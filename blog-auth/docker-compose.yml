services:
  postgres:
    image: postgres:alpine
    container_name: blog-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - blog-network

  backend:
    build: ./backend
    container_name: blog-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      - postgres
    networks:
      - blog-network

  frontend:
    build: ./frontend
    container_name: blog-frontend
    restart: always
    networks:
      - blog-network

  nginx:
    build: ./nginx
    container_name: blog-nginx
    restart: always
    ports:
      - "82:80"
    depends_on:
      - frontend
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  postgres-data:
