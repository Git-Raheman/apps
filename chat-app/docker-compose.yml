services:
  redis:
    image: redis:alpine
    container_name: chat-redis
    restart: always
    networks:
      - chat-network

  backend:
    build: ./backend
    container_name: chat-backend
    restart: always
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 5000
    depends_on:
      - redis
    networks:
      - chat-network

  frontend:
    build: ./frontend
    container_name: chat-frontend
    restart: always
    networks:
      - chat-network

  nginx:
    build: ./nginx
    container_name: chat-nginx
    restart: always
    ports:
      - "81:80"
    depends_on:
      - frontend
      - backend
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
